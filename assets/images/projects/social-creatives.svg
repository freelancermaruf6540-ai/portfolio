<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="art-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#07080d" />
      <stop offset="100%" stop-color="#111726" />
    </linearGradient>
    <linearGradient id="art-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#dfc299" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#art-bg)" />

  <!-- Center Decorative Glow -->
  <circle cx="600" cy="400" r="300" fill="#c5a880" opacity="0.05" />

  <!-- Showcase of 3 Editorial Poster Designs -->
  <!-- Poster 1: Left Angled -->
  <g transform="translate(160, 160) rotate(-6)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="280" height="420" rx="8" fill="#121826" stroke="#25324a" stroke-width="1.5" />
    <rect x="20" y="20" width="240" height="240" rx="4" fill="#0b0e17" />
    
    <!-- Abstract Artwork inside poster -->
    <circle cx="140" cy="140" r="70" fill="none" stroke="url(#art-gold)" stroke-width="2" />
    <circle cx="140" cy="140" r="40" fill="url(#art-gold)" opacity="0.8" />
    <line x1="80" y1="140" x2="200" y2="140" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    
    <text x="20" y="295" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="1">SYMPHONY OF LIGHT</text>
    <text x="20" y="318" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="2">ANNUAL DESIGN EXHIBITION</text>
    <text x="20" y="348" fill="#6d768c" font-family="-apple-system, sans-serif" font-size="10">Curated visual identity &amp; promotional collateral</text>
    <rect x="20" y="375" width="80" height="22" rx="4" fill="#1b2438" />
    <text x="60" y="390" fill="#c5a880" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PRINT &amp; DIGITAL</text>
  </g>

  <!-- Poster 2: Center Elevated -->
  <g transform="translate(460, 120)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="300" height="460" rx="8" fill="#0f1524" stroke="#c5a880" stroke-width="1.5" />
    <rect x="20" y="20" width="260" height="270" rx="4" fill="#070a12" />
    
    <!-- Luxury Typography & Editorial composition -->
    <text x="150" y="90" fill="#dfc299" font-family="'Times New Roman', serif" font-size="52" font-weight="bold" text-anchor="middle" letter-spacing="4">NOIR</text>
    <text x="150" y="115" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="6">CREATIVE DIRECTION</text>
    
    <circle cx="150" cy="185" r="45" fill="none" stroke="#253552" stroke-width="1" stroke-dasharray="4,4" />
    <rect x="135" y="170" width="30" height="30" rx="4" fill="url(#art-gold)" />
    
    <text x="24" y="330" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="1">ARCHITECTURAL MONOGRAPH</text>
    <text x="24" y="355" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2">EDITORIAL EDITORIAL ART DIRECTION</text>
    <text x="24" y="385" fill="#7d879e" font-family="-apple-system, sans-serif" font-size="11">Bespoke layout, typographic rhythm, and print craft.</text>
    <rect x="24" y="415" width="100" height="24" rx="4" fill="rgba(197, 168, 128, 0.15)" />
    <text x="74" y="431" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">AWARD WINNER</text>
  </g>

  <!-- Poster 3: Right Angled -->
  <g transform="translate(780, 160) rotate(6)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="280" height="420" rx="8" fill="#121826" stroke="#25324a" stroke-width="1.5" />
    <rect x="20" y="20" width="240" height="240" rx="4" fill="#0b0e17" />
    
    <!-- Dynamic Social Media Ad asset -->
    <polygon points="140,65 210,185 70,185" fill="none" stroke="url(#art-gold)" stroke-width="3" />
    <circle cx="140" cy="145" r="22" fill="#dfc299" opacity="0.9" />

    <text x="20" y="295" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="1">HIGH-CONVERSION ADS</text>
    <text x="20" y="318" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="2">SOCIAL MARKETING SUITE</text>
    <text x="20" y="348" fill="#6d768c" font-family="-apple-system, sans-serif" font-size="10">Visual creatives optimized for stop-the-scroll CTR.</text>
    <rect x="20" y="375" width="85" height="22" rx="4" fill="#1b2438" />
    <text x="62" y="390" fill="#c5a880" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SOCIAL MEDIA</text>
  </g>
</svg>
