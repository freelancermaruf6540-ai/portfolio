<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="mkt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c" />
      <stop offset="50%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#121827" />
    </linearGradient>
    <linearGradient id="mkt-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#dfc299" />
    </linearGradient>
    <linearGradient id="funnel-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#243452" />
      <stop offset="100%" stop-color="#1c283f" />
    </linearGradient>
    <linearGradient id="funnel-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b4d75" />
      <stop offset="100%" stop-color="#283652" />
    </linearGradient>
    <linearGradient id="funnel-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#9d7e52" />
    </linearGradient>
    <filter id="mkt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#mkt-bg)" />

  <circle cx="950" cy="200" r="260" fill="#c5a880" opacity="0.08" filter="url(#mkt-glow)" />
  <circle cx="200" cy="650" r="280" fill="#1b2845" opacity="0.35" filter="url(#mkt-glow)" />

  <!-- Main Campaign Command Center -->
  <rect x="110" y="85" width="980" height="630" rx="16" fill="#0d111a" stroke="#1d2638" stroke-width="1.5" />

  <!-- Header -->
  <rect x="110" y="85" width="980" height="56" rx="16" fill="#121724" />
  <text x="145" y="119" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">PERFORMANCE MARKETING CAMPAIGN &amp; CRO SUITE</text>
  <rect x="880" y="101" width="180" height="24" rx="12" fill="rgba(197, 168, 128, 0.15)" />
  <text x="970" y="117" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ROAS 4.82X VERIFIED</text>

  <!-- Key Metrics Row -->
  <g transform="translate(145, 165)">
    <rect x="0" y="0" width="210" height="95" rx="10" fill="#131926" stroke="#20293d" stroke-width="1" />
    <text x="20" y="30" fill="#7d8597" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">TOTAL AD ATTRIBUTED ACQUISITION</text>
    <text x="20" y="66" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">$1,420,800</text>

    <rect x="230" y="0" width="210" height="95" rx="10" fill="#131926" stroke="#20293d" stroke-width="1" />
    <text x="250" y="30" fill="#7d8597" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">AVG. CUSTOMER CPA</text>
    <text x="250" y="66" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">-44.6% ($18.4)</text>

    <rect x="460" y="0" width="210" height="95" rx="10" fill="#131926" stroke="#20293d" stroke-width="1" />
    <text x="480" y="30" fill="#7d8597" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">LANDING PAGE CONVERSION</text>
    <text x="480" y="66" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">6.12%</text>

    <rect x="690" y="0" width="220" height="95" rx="10" fill="#131926" stroke="#20293d" stroke-width="1" />
    <text x="710" y="30" fill="#7d8597" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">AUDIENCE REACH (OMNICHANNEL)</text>
    <text x="710" y="66" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">3.4M+</text>
  </g>

  <!-- Middle: Full Funnel Visualization & Creative Breakdown -->
  <g transform="translate(145, 285)">
    <!-- Funnel Stage Card -->
    <rect x="0" y="0" width="510" height="395" rx="12" fill="#111622" stroke="#1f283d" stroke-width="1" />
    <text x="24" y="36" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Conversion Funnel Velocity</text>
    <text x="24" y="56" fill="#6d7588" font-family="-apple-system, sans-serif" font-size="11">Top of funnel awareness to checkout completion</text>

    <!-- Funnel Graphic -->
    <g transform="translate(30, 85)">
      <!-- Top Funnel -->
      <polygon points="0,0 450,0 390,65 60,65" fill="url(#funnel-1)" />
      <text x="225" y="38" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TOP OF FUNNEL: Impressions &amp; Paid Reach (3,420,000)</text>

      <!-- Mid Funnel -->
      <polygon points="65,75 385,75 325,145 125,145" fill="url(#funnel-2)" />
      <text x="225" y="115" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">MID FUNNEL: High-Intent Landing Visits (248,000)</text>

      <!-- Bottom Funnel -->
      <polygon points="130,155 320,155 260,225 190,225" fill="url(#funnel-3)" />
      <text x="225" y="195" fill="#08090d" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">BOTTOM FUNNEL: Qualified Purchases (15,177)</text>
    </g>

    <!-- Metric Callout below funnel -->
    <rect x="30" y="325" width="450" height="46" rx="8" fill="#182030" />
    <text x="50" y="353" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">RESULT:</text>
    <text x="110" y="353" fill="#cbd2e1" font-family="-apple-system, sans-serif" font-size="12">+186% Net ROI compared to previous agency agency benchmark</text>
  </g>

  <!-- Right: Omnichannel Distribution & A/B Creatives -->
  <g transform="translate(680, 285)">
    <rect x="0" y="0" width="375" height="395" rx="12" fill="#111622" stroke="#1f283d" stroke-width="1" />
    <text x="24" y="36" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Channel Attribution Matrix</text>
    <text x="24" y="56" fill="#6d7588" font-family="-apple-system, sans-serif" font-size="11">Data-driven budget reallocation</text>

    <!-- Channel Rows -->
    <g transform="translate(24, 85)">
      <!-- Google Search & Shopping -->
      <text x="0" y="16" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Google High-Intent Search &amp; PMax</text>
      <text x="325" y="16" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end">5.2x ROAS</text>
      <rect x="0" y="26" width="325" height="6" rx="3" fill="#1a2336" />
      <rect x="0" y="26" width="280" height="6" rx="3" fill="url(#mkt-gold)" />

      <!-- Meta Ads -->
      <text x="0" y="66" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Meta Advantage+ Retargeting</text>
      <text x="325" y="66" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end">4.4x ROAS</text>
      <rect x="0" y="76" width="325" height="6" rx="3" fill="#1a2336" />
      <rect x="0" y="76" width="240" height="6" rx="3" fill="url(#mkt-gold)" />

      <!-- Organic SEO Funnels -->
      <text x="0" y="116" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Organic Inbound SEO Funnels</text>
      <text x="325" y="116" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end">Inf. (Free)</text>
      <rect x="0" y="126" width="325" height="6" rx="3" fill="#1a2336" />
      <rect x="0" y="126" width="310" height="6" rx="3" fill="#3bd652" />

      <!-- LinkedIn B2B -->
      <text x="0" y="166" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">LinkedIn Executive Account-Based</text>
      <text x="325" y="166" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end">3.9x ROAS</text>
      <rect x="0" y="176" width="325" height="6" rx="3" fill="#1a2336" />
      <rect x="0" y="176" width="200" height="6" rx="3" fill="url(#mkt-gold)" />
    </g>

    <!-- A/B Creative Winner -->
    <g transform="translate(24, 290)">
      <rect x="0" y="0" width="325" height="80" rx="8" fill="#171e2e" stroke="#253046" stroke-width="1" />
      <rect x="12" y="12" width="56" height="56" rx="6" fill="#202a3d" />
      <circle cx="40" cy="40" r="14" fill="url(#mkt-gold)" />
      <text x="40" y="44" fill="#0c101a" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle">A/B</text>
      
      <text x="80" y="32" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Winner: Variant B (+82% CTR)</text>
      <text x="80" y="52" fill="#7a8296" font-family="-apple-system, sans-serif" font-size="11">Dynamic video hook + social proof</text>
    </g>
  </g>
</svg>
