<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c121e" />
      <stop offset="50%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#0e1626" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#dfc299" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151b2a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d121c" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="chart-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5a880" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c5a880" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
    <line x1="700" y1="0" x2="700" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
    <line x1="1100" y1="0" x2="1100" y2="800" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="640" x2="1200" y2="640" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="850" cy="300" r="280" fill="#c5a880" opacity="0.06" filter="url(#glow)" />
  <circle cx="350" cy="600" r="240" fill="#1b2a4a" opacity="0.4" filter="url(#glow)" />

  <!-- Modern Browser Frame Mockup -->
  <rect x="120" y="90" width="960" height="620" rx="16" fill="#0a0d14" stroke="#1d2636" stroke-width="1.5" />
  
  <!-- Browser Header -->
  <rect x="120" y="90" width="960" height="52" rx="16" fill="#101522" />
  <circle cx="156" cy="116" r="5.5" fill="#ff5f56" opacity="0.75" />
  <circle cx="176" cy="116" r="5.5" fill="#ffbd2e" opacity="0.75" />
  <circle cx="196" cy="116" r="5.5" fill="#27c93f" opacity="0.75" />
  
  <!-- URL Bar -->
  <rect x="360" y="103" width="480" height="26" rx="6" fill="#090b10" stroke="#1c2333" stroke-width="1" />
  <text x="600" y="120" fill="#6d7588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.5">https://apex-enterprise.digital/platform</text>

  <!-- Dashboard Content Inside Browser -->
  <!-- Sidebar -->
  <rect x="120" y="142" width="200" height="568" fill="#0d111b" />
  <line x1="320" y1="142" x2="320" y2="710" stroke="#1d2636" stroke-width="1" />
  
  <!-- Logo in App -->
  <rect x="150" y="175" width="28" height="28" rx="6" fill="url(#gold-grad)" />
  <text x="164" y="193" fill="#08090d" font-family="-apple-system, sans-serif" font-weight="800" font-size="14" text-anchor="middle">A</text>
  <text x="190" y="194" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="1">APEX</text>

  <!-- Sidebar Nav items -->
  <rect x="140" y="235" width="160" height="34" rx="6" fill="#182030" />
  <text x="160" y="257" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Overview</text>
  <text x="160" y="295" fill="#646c80" font-family="-apple-system, sans-serif" font-size="12">Performance</text>
  <text x="160" y="333" fill="#646c80" font-family="-apple-system, sans-serif" font-size="12">Conversions</text>
  <text x="160" y="371" fill="#646c80" font-family="-apple-system, sans-serif" font-size="12">SEO Traffic</text>
  <text x="160" y="409" fill="#646c80" font-family="-apple-system, sans-serif" font-size="12">Campaigns</text>
  <text x="160" y="447" fill="#646c80" font-family="-apple-system, sans-serif" font-size="12">Integrations</text>

  <!-- Main Canvas Area -->
  <!-- Top Stats Row -->
  <g transform="translate(350, 175)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="215" height="96" rx="10" fill="url(#card-grad)" stroke="#1f293d" stroke-width="1" />
    <text x="20" y="32" fill="#7d8597" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">NET REVENUE</text>
    <text x="20" y="68" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">$284,520</text>
    <rect x="145" y="20" width="52" height="20" rx="10" fill="rgba(197, 168, 128, 0.15)" />
    <text x="171" y="34" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+34.2%</text>

    <!-- Stat 2 -->
    <rect x="235" y="0" width="215" height="96" rx="10" fill="url(#card-grad)" stroke="#1f293d" stroke-width="1" />
    <text x="255" y="32" fill="#7d8597" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">PAGE LOAD SPEED</text>
    <text x="255" y="68" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">0.42s</text>
    <rect x="380" y="20" width="52" height="20" rx="10" fill="rgba(39, 201, 63, 0.15)" />
    <text x="406" y="34" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">99/100</text>

    <!-- Stat 3 -->
    <rect x="470" y="0" width="235" height="96" rx="10" fill="url(#card-grad)" stroke="#1f293d" stroke-width="1" />
    <text x="490" y="32" fill="#7d8597" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">CONVERSION RATE</text>
    <text x="490" y="68" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">4.85%</text>
    <rect x="635" y="20" width="52" height="20" rx="10" fill="rgba(197, 168, 128, 0.15)" />
    <text x="661" y="34" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+148%</text>
  </g>

  <!-- Large Graph Card -->
  <g transform="translate(350, 295)">
    <rect x="0" y="0" width="705" height="240" rx="12" fill="url(#card-grad)" stroke="#1f293d" stroke-width="1" />
    <text x="24" y="36" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Organic Growth &amp; User Velocity</text>
    <text x="24" y="56" fill="#6d7588" font-family="-apple-system, sans-serif" font-size="11">Real-time telemetry across web and marketing channels</text>

    <!-- Chart grid lines -->
    <line x1="24" y1="90" x2="680" y2="90" stroke="#161e2c" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="24" y1="135" x2="680" y2="135" stroke="#161e2c" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="24" y1="180" x2="680" y2="180" stroke="#161e2c" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Chart Area Fill -->
    <path d="M 40 190 Q 140 160 220 170 T 380 130 T 520 90 T 660 65 L 660 210 L 40 210 Z" fill="url(#chart-area)" />
    <!-- Chart Stroke -->
    <path d="M 40 190 Q 140 160 220 170 T 380 130 T 520 90 T 660 65" fill="none" stroke="#dfc299" stroke-width="3" stroke-linecap="round" />

    <!-- Data Points -->
    <circle cx="220" cy="170" r="4.5" fill="#dfc299" stroke="#0c121e" stroke-width="2" />
    <circle cx="380" cy="130" r="4.5" fill="#dfc299" stroke="#0c121e" stroke-width="2" />
    <circle cx="520" cy="90" r="4.5" fill="#dfc299" stroke="#0c121e" stroke-width="2" />
    <circle cx="660" cy="65" r="5.5" fill="#f4f4f7" stroke="#c5a880" stroke-width="3" />
  </g>

  <!-- Bottom Split Cards -->
  <g transform="translate(350, 555)">
    <!-- Sub card 1 -->
    <rect x="0" y="0" width="340" height="130" rx="10" fill="url(#card-grad)" stroke="#1f293d" stroke-width="1" />
    <text x="20" y="30" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Core Web Vitals</text>
    <text x="20" y="52" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">LCP 0.8s · FID 12ms · CLS 0.00</text>
    <rect x="20" y="70" width="300" height="8" rx="4" fill="#161e2e" />
    <rect x="20" y="70" width="285" height="8" rx="4" fill="url(#gold-grad)" />
    <text x="20" y="105" fill="#788094" font-family="-apple-system, sans-serif" font-size="11">Production Lighthouse 100% Score</text>

    <!-- Sub card 2 -->
    <rect x="365" y="0" width="340" height="130" rx="10" fill="url(#card-grad)" stroke="#1f293d" stroke-width="1" />
    <text x="385" y="30" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Tech Stack Architecture</text>
    <text x="385" y="52" fill="#788094" font-family="-apple-system, sans-serif" font-size="11">Next.js · TypeScript · Tailwind · Node</text>
    <g transform="translate(385, 75)">
      <rect x="0" y="0" width="60" height="24" rx="4" fill="#1a2336" />
      <text x="30" y="16" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">SSR/ISR</text>
      <rect x="70" y="0" width="68" height="24" rx="4" fill="#1a2336" />
      <text x="104" y="16" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">JAMSTACK</text>
      <rect x="148" y="0" width="60" height="24" rx="4" fill="#1a2336" />
      <text x="178" y="16" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">EDGE CDN</text>
    </g>
  </g>
</svg>
