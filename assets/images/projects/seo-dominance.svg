<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="seo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#07090f" />
      <stop offset="100%" stop-color="#0f1624" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#dfc299" />
    </linearGradient>
    <linearGradient id="seo-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0e131f" stop-opacity="0.9" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#seo-bg)" />

  <!-- Background Aura -->
  <circle cx="900" cy="250" r="320" fill="#c5a880" opacity="0.07" filter="url(#blur-glow)" />
  <circle cx="250" cy="650" r="280" fill="#1e2d4d" opacity="0.3" filter="url(#blur-glow)" />

  <!-- Subtle Matrix grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="800" />
    <line x1="450" y1="0" x2="450" y2="800" />
    <line x1="750" y1="0" x2="750" y2="800" />
    <line x1="1050" y1="0" x2="1050" y2="800" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Main SEO Intelligence Console -->
  <rect x="100" y="80" width="1000" height="640" rx="16" fill="#0c101a" stroke="#1d2638" stroke-width="1.5" />

  <!-- Console Header -->
  <rect x="100" y="80" width="1000" height="58" rx="16" fill="#131929" />
  <line x1="100" y1="138" x2="1100" y2="138" stroke="#1e273a" stroke-width="1" />
  
  <rect x="130" y="98" width="22" height="22" rx="5" fill="url(#gold-accent)" />
  <text x="141" y="114" fill="#08090d" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle">S</text>
  <text x="165" y="114" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ENTERPRISE SEO ENGINE</text>
  
  <!-- Status badge -->
  <rect x="910" y="97" width="155" height="24" rx="12" fill="rgba(39, 201, 63, 0.12)" stroke="rgba(39, 201, 63, 0.3)" stroke-width="1" />
  <circle cx="926" cy="109" r="4" fill="#27c93f" />
  <text x="990" y="113" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Live Index Monitoring</text>

  <!-- 3 Top Metric Cards -->
  <g transform="translate(130, 165)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="295" height="105" rx="12" fill="url(#seo-card)" stroke="#222d42" stroke-width="1" />
    <text x="24" y="32" fill="#7a8296" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ORGANIC MONTHLY CLICKS</text>
    <text x="24" y="72" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">482,900</text>
    <rect x="200" y="24" width="72" height="22" rx="11" fill="rgba(197, 168, 128, 0.15)" />
    <text x="236" y="39" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">+384.6%</text>

    <!-- Metric 2 -->
    <rect x="320" y="0" width="295" height="105" rx="12" fill="url(#seo-card)" stroke="#222d42" stroke-width="1" />
    <text x="344" y="32" fill="#7a8296" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">TOP 3 RANKINGS (SERP)</text>
    <text x="344" y="72" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">1,240+</text>
    <rect x="520" y="24" width="72" height="22" rx="11" fill="rgba(39, 201, 63, 0.15)" />
    <text x="556" y="39" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">+192 Pos</text>

    <!-- Metric 3 -->
    <rect x="640" y="0" width="300" height="105" rx="12" fill="url(#seo-card)" stroke="#222d42" stroke-width="1" />
    <text x="664" y="32" fill="#7a8296" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">DOMAIN AUTHORITY</text>
    <text x="664" y="72" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">74 / 100</text>
    <rect x="840" y="24" width="78" height="22" rx="11" fill="rgba(197, 168, 128, 0.15)" />
    <text x="879" y="39" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Elite Tier</text>
  </g>

  <!-- Split Data & Keywords Table -->
  <g transform="translate(130, 295)">
    <!-- Keyword Tracking Table Card -->
    <rect x="0" y="0" width="580" height="390" rx="12" fill="url(#seo-card)" stroke="#222d42" stroke-width="1" />
    <text x="24" y="36" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">High-Intent Keyword Dominance</text>
    <text x="24" y="56" fill="#6d7588" font-family="-apple-system, sans-serif" font-size="11">Automated position tracking against high-competition queries</text>

    <!-- Table Header -->
    <rect x="20" y="80" width="540" height="32" rx="6" fill="#182133" />
    <text x="35" y="101" fill="#8f97ab" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">KEYWORD CLUSTER</text>
    <text x="280" y="101" fill="#8f97ab" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">VOLUME</text>
    <text x="380" y="101" fill="#8f97ab" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">POSITION</text>
    <text x="475" y="101" fill="#8f97ab" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">INTENT</text>

    <!-- Row 1 -->
    <text x="35" y="145" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">enterprise digital marketing strategy</text>
    <text x="280" y="145" fill="#8f97ab" font-family="-apple-system, sans-serif" font-size="12">44,000/mo</text>
    <text x="380" y="145" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">#1 (▲ +14)</text>
    <rect x="475" y="130" width="65" height="20" rx="4" fill="rgba(197, 168, 128, 0.15)" />
    <text x="507" y="144" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">COMMERCIAL</text>

    <line x1="20" y1="165" x2="560" y2="165" stroke="#1c2538" stroke-width="1" />

    <!-- Row 2 -->
    <text x="35" y="195" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">modern headless e-commerce stack</text>
    <text x="280" y="195" fill="#8f97ab" font-family="-apple-system, sans-serif" font-size="12">18,500/mo</text>
    <text x="380" y="195" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">#1 (▲ +8)</text>
    <rect x="475" y="180" width="65" height="20" rx="4" fill="rgba(197, 168, 128, 0.15)" />
    <text x="507" y="194" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">TRANSACTION</text>

    <line x1="20" y1="215" x2="560" y2="215" stroke="#1c2538" stroke-width="1" />

    <!-- Row 3 -->
    <text x="35" y="245" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">conversion rate optimization audit</text>
    <text x="280" y="245" fill="#8f97ab" font-family="-apple-system, sans-serif" font-size="12">27,200/mo</text>
    <text x="380" y="245" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">#2 (▲ +22)</text>
    <rect x="475" y="230" width="65" height="20" rx="4" fill="rgba(197, 168, 128, 0.15)" />
    <text x="507" y="244" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">COMMERCIAL</text>

    <line x1="20" y1="265" x2="560" y2="265" stroke="#1c2538" stroke-width="1" />

    <!-- Row 4 -->
    <text x="35" y="295" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">technical seo architecture framework</text>
    <text x="280" y="295" fill="#8f97ab" font-family="-apple-system, sans-serif" font-size="12">12,100/mo</text>
    <text x="380" y="295" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">#1 (▲ +5)</text>
    <rect x="475" y="280" width="65" height="20" rx="4" fill="rgba(197, 168, 128, 0.15)" />
    <text x="507" y="294" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">INFORMATIONAL</text>

    <line x1="20" y1="315" x2="560" y2="315" stroke="#1c2538" stroke-width="1" />

    <!-- Row 5 -->
    <text x="35" y="345" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">luxury brand visual communication</text>
    <text x="280" y="345" fill="#8f97ab" font-family="-apple-system, sans-serif" font-size="12">31,000/mo</text>
    <text x="380" y="345" fill="#3bd652" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">#2 (▲ +19)</text>
    <rect x="475" y="330" width="65" height="20" rx="4" fill="rgba(197, 168, 128, 0.15)" />
    <text x="507" y="344" fill="#dfc299" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">COMMERCIAL</text>
  </g>

  <!-- Right Side Audit & Crawl Health Card -->
  <g transform="translate(730, 295)">
    <rect x="0" y="0" width="340" height="390" rx="12" fill="url(#seo-card)" stroke="#222d42" stroke-width="1" />
    <text x="24" y="36" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Technical Health Audit</text>
    <text x="24" y="56" fill="#6d7588" font-family="-apple-system, sans-serif" font-size="11">0 Errors · 0 Broken Redirects</text>

    <!-- Circular Progress Graphic -->
    <g transform="translate(170, 150)">
      <circle cx="0" cy="0" r="60" fill="none" stroke="#192336" stroke-width="12" />
      <circle cx="0" cy="0" r="60" fill="none" stroke="url(#gold-accent)" stroke-width="12" stroke-dasharray="377" stroke-dashoffset="15" stroke-linecap="round" transform="rotate(-90)" />
      <text x="0" y="8" fill="#f4f4f7" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" text-anchor="middle">98%</text>
      <text x="0" y="26" fill="#8f97ab" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">CRAWL SCORE</text>
    </g>

    <!-- Checklist items -->
    <g transform="translate(24, 250)">
      <circle cx="8" cy="8" r="4" fill="#3bd652" />
      <text x="22" y="12" fill="#cbd2e1" font-family="-apple-system, sans-serif" font-size="12">Schema.org Structured Data: 100%</text>

      <circle cx="8" cy="38" r="4" fill="#3bd652" />
      <text x="22" y="42" fill="#cbd2e1" font-family="-apple-system, sans-serif" font-size="12">XML Sitemaps &amp; Canonical Tags: OK</text>

      <circle cx="8" cy="68" r="4" fill="#3bd652" />
      <text x="22" y="72" fill="#cbd2e1" font-family="-apple-system, sans-serif" font-size="12">Mobile Usability &amp; Core Vitals: PASS</text>

      <circle cx="8" cy="98" r="4" fill="#3bd652" />
      <text x="22" y="102" fill="#cbd2e1" font-family="-apple-system, sans-serif" font-size="12">Internal Link Graph: Fully Optimized</text>
    </g>
  </g>
</svg>
